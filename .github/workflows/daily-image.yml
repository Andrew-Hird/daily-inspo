name: Daily AI Image

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send to this address only (skips broadcast)'
        required: false

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Fetch daily image
        run: node generate-and-send.js --fetch-image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Commit image to repo
        id: commit-image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily.jpg
          git commit -m "chore: update daily image" || true
          git push origin main
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Generate image and send email
        run: node generate-and-send.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          DAILY_IMAGE_URL: "https://raw.githubusercontent.com/andrew-hird/daily-inspo/${{ steps.commit-image.outputs.sha }}/daily.jpg"
          TEST_EMAIL: ${{ inputs.test_email }}
